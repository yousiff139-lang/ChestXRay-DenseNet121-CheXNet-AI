[project]
name = "chestxray-backend"
version = "1.0.0"
description = "Chest X-Ray Disease Classification API using DenseNet-121 and ResNet-50"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=2.4.4",
    "opencv-python>=4.9.0",
    "pillow>=11.2.1",
    "pydantic-settings>=2.9.1",
    "pydicom>=3.0.1",
    "pylibjpeg>=2.0.1",
    "pylibjpeg-libjpeg>=2.3.0",
    "pylibjpeg-openjpeg>=2.4.0",
    "python-dotenv>=1.1.0",
    "scikit-learn>=1.5.0",
    "grad-cam>=1.5.0",
    "matplotlib>=3.9.0",
    "httpx>=0.27.0",
    "gdcm>=1.1",
    "scikit-image>=0.24.0",
    "torchxrayvision>=1.5.7",
]
